<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación Diagnóstica — Bloque C</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
      background-color: #F8FAFC;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border: 3px solid #000;
      box-shadow: 6px 6px 0px #000;
      border-radius: 8px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background: #86EFAC;
      border: 2px solid #000;
      cursor: pointer;
      margin: 8px;
    }

    #mensaje-resultado {
      margin-top: 20px;
      padding: 12px;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
  <script src="script.js"></script>
</head>
<body>

  <div class="card">
    <h1>Panel Interactivo UETS</h1>
    <p>Ingresa tu nombre para generar tu saludo oficial:</p>
    <br>

    <input type="text" id="input-nombre" placeholder="Ej: Mateo Vintimilla" style="padding: 8px; font-size: 16px; width: 80%; border: 2px solid #000; border-radius: 4px;">

    <br><br>

    <button id="btn-saludar">Saludar al Estudiante</button>
    <button id="btn-limpiar" style="background: #FDA4AF;">Limpiar</button>

    <div id="mensaje-resultado">Esperando interacción...</div>
  </div>

</body>
</html>
