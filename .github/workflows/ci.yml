name: "Autograding"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  evaluate:
    name: "Autograding and Integrity Guard"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: "Checkout del Codigo"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Instalar Dependencias"
        run: pnpm install --no-frozen-lockfile

      # 1. FILE INTEGRITY GUARD
      - name: "File Integrity Guard"
        id: file_guard
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          UNAUTHORIZED_FILES=""
          for file in $CHANGED_FILES; do
            case "$file" in
              bloque_a/* | bloque_b/* | bloque_c/* | bloque_d/* | README.md) ;;
              *) UNAUTHORIZED_FILES="$UNAUTHORIZED_FILES $file" ;;
            esac
          done

          if [ -n "$UNAUTHORIZED_FILES" ]; then
            echo "status=fail" >> $GITHUB_OUTPUT
            echo "unauthorized=$UNAUTHORIZED_FILES" >> $GITHUB_OUTPUT
          else
            echo "status=pass" >> $GITHUB_OUTPUT
          fi

      # 2. COMMIT MESSAGE LINTER
      - name: "Commit Message Linter"
        id: commit_lint
        run: |
          COMMITS=$(git log --format="%s" origin/main...HEAD)
          INVALID_COMMITS=""
          PATTERN="^(feat|fix|docs|style|refactor|test|chore)(\([a-zA-Z0-9_\-]+\))?: .+"
          while IFS= read -r commit; do
            if [ -n "$commit" ] && ! [[ "$commit" =~ $PATTERN ]]; then
              INVALID_COMMITS="$INVALID_COMMITS '$commit'"
            fi
          done <<< "$COMMITS"

          if [ -n "$INVALID_COMMITS" ]; then
            echo "status=warn" >> $GITHUB_OUTPUT
          else
            echo "status=pass" >> $GITHUB_OUTPUT
          fi

      # 3. TYPECHECK
      - name: "Strict Typecheck"
        id: typecheck
        continue-on-error: true
        run: |
          pnpm run check
          if [ $? -eq 0 ]; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      # 4. RUN INDIVIDUAL CHALLENGE TESTS
      - name: "Test Reto 01"
        id: test_01
        continue-on-error: true
        run: if pnpm run start:01; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      - name: "Test Reto 02"
        id: test_02
        continue-on-error: true
        run: if pnpm run start:02; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      - name: "Test Reto 03"
        id: test_03
        continue-on-error: true
        run: if pnpm run start:03; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      - name: "Test Reto 04"
        id: test_04
        continue-on-error: true
        run: if pnpm run start:04; then echo "status=pass" >> $GITHUB_OUTPUT; else echo "status=fail" >> $GITHUB_OUTPUT; fi

      # 5. PUBLICAR REPORTE EN PR
      - name: "Publicar Comentario en el PR"
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request_target'
        env:
